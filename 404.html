<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kayra.pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: red;
      font-size: 77px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      font-size: 17px;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: red;
      color: rgb(0, 0, 0);
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s ease;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .btn:hover {
      background: #ff1a1a;
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>kayra.pro</h1>
    <p>kayralrics.net</p>

    <a href="https://kayra.pro" class="btn">
      back
    </a>
  </div>
</body>
</html>
